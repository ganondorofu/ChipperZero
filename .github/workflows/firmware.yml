name: Build & Deploy

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Collect firmware files
        run: |
          mkdir -p docs/firmware
          cp .pio/build/esp32dev/firmware.bin   docs/firmware/firmware.bin
          cp .pio/build/esp32dev/bootloader.bin docs/firmware/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin docs/firmware/partitions.bin
          BOOT_APP=$(find ~/.platformio -name "boot_app0.bin" | head -1)
          cp "$BOOT_APP" docs/firmware/boot_app0.bin

      - name: Commit firmware to docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware/
          git diff --staged --quiet || git commit -m "ci: update firmware binaries"
          git push
