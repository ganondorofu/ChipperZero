<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#15171c" />
<title>ChipperZero BLE Remote</title>
<style>
  :root {
    --bg: #15171c;
    --panel: #1f232b;
    --accent: #ff8a00;
    --accent2: #ffb347;
    --text: #e8e8e8;
    --muted: #8a8f99;
    --ok: #36c46b;
    --err: #e35f5f;
    --oled-on:  #ffb347;
    --oled-off: #1a1d22;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
  .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--err);
    margin-right: 6px;
    vertical-align: middle;
  }
  .dot.ok { background: var(--ok); }
  .panel {
    background: var(--panel);
    border-radius: 10px;
    padding: 14px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    color: #111;
    font-weight: 600;
    background: var(--accent);
    padding: 14px 16px;
    font-size: 15px;
    transition: filter 0.1s, transform 0.05s;
    touch-action: manipulation;
    user-select: none;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.96); filter: brightness(0.9); }
  button:disabled { background: #3a3f4a; color: #6c727f; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > button { flex: 1; }

  .oled-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0d0f13;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #2a2e36;
  }
  canvas#oled {
    width: min(384px, calc(100vw - 68px));
    height: auto;
    aspect-ratio: 2 / 1;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: var(--oled-off);
    border-radius: 4px;
  }
  .oled-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    text-align: center;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .pad button {
    height: clamp(56px, 14vw, 72px);
    font-size: clamp(13px, 3.5vw, 16px);
  }
  .pad .ok    { background: var(--accent2); }
  .pad .back  { grid-column: 1 / span 3; background: #4a4f5a; color: #fff; }

  .ios-note {
    background: #2a2030;
    border: 1px solid #5a3a6a;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: #c9a0e8;
    display: none;
  }
  .ios-note a { color: #d4b0f0; }

  .log {
    height: 160px;
    overflow-y: auto;
    background: #0d0f13;
    border-radius: 8px;
    padding: 8px 10px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
    white-space: pre-wrap;
  }
  .log .tx  { color: var(--accent2); }
  .log .rx  { color: #6cb1ff; }
  .log .err { color: var(--err); }
  .log .ok  { color: var(--ok); }
  .hint { font-size: 12px; color: var(--muted); }
  kbd {
    background: #2c313b;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: Consolas, monospace;
    font-size: 11px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ChipperZero Remote</h1>
    <span><span id="dot" class="dot"></span><span id="state">未接続</span></span>
  </header>

  <div id="ios-note" class="ios-note">
    iOS Safari は Web Bluetooth 非対応です。
    <a href="https://apps.apple.com/app/bluefy-web-ble-browser/id1492822055" target="_blank">Bluefy</a>
    または <a href="https://apps.apple.com/app/webble/id1193531073" target="_blank">WebBLE</a> アプリでこのページを開いてください。
  </div>

  <div class="panel">
    <div class="row">
      <button id="btn-connect">接続</button>
      <button id="btn-disconnect" disabled>切断</button>
    </div>
  </div>

  <div class="panel">
    <div class="oled-wrap">
      <canvas id="oled" width="128" height="64"></canvas>
    </div>
    <div class="oled-meta"><span id="fps">--</span> · <span id="frames">0</span> frames</div>
  </div>

  <div class="panel">
    <div class="pad">
      <button class="left"  data-op="1">◀ LEFT</button>
      <button class="ok"    data-op="3">● OK</button>
      <button class="right" data-op="2">▶ RIGHT</button>
      <button class="back"  data-op="4">◀◀ BACK</button>
    </div>
    <div class="hint" style="margin-top:10px;">
      PC: <kbd>←</kbd><kbd>→</kbd>移動 / <kbd>Enter</kbd>OK / <kbd>Esc</kbd>BACK
    </div>
  </div>

  <div class="panel">
    <div class="hint" style="margin-bottom:6px;">ログ</div>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
const SERVICE_UUID = 'c4b1e000-7a66-4c12-9c69-d2f8c4a3f100';
const CMD_UUID     = 'c4b1e001-7a66-4c12-9c69-d2f8c4a3f100';
const STATUS_UUID  = 'c4b1e002-7a66-4c12-9c69-d2f8c4a3f100';
const FB_UUID      = 'c4b1e003-7a66-4c12-9c69-d2f8c4a3f100';
const LOG_UUID     = 'c4b1e004-7a66-4c12-9c69-d2f8c4a3f100';

const OP_NAMES = { 1: 'LEFT', 2: 'RIGHT', 3: 'OK', 4: 'BACK' };
const FB_LEN   = 1024;
const FB_CHUNK = 240;

let device = null, cmdChar = null, statusChar = null, fbChar = null, logChar = null;
const fbBuf = new Uint8Array(FB_LEN);
let frameCount = 0, lastFpsCalcAt = 0, lastFpsFrames = 0;

const $ = id => document.getElementById(id);
const logEl = $('log');
const canvas = $('oled');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#1a1d22';
ctx.fillRect(0, 0, 128, 64);

// iOS detection
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
if (isIOS) $('ios-note').style.display = 'block';

function log(msg, cls = '') {
  const time = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${time}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.childNodes.length > 200) logEl.removeChild(logEl.firstChild);
}

function setConnected(connected) {
  $('dot').classList.toggle('ok', connected);
  $('state').textContent = connected ? '接続中' : '未接続';
  $('btn-connect').disabled = connected;
  $('btn-disconnect').disabled = !connected;
  document.querySelectorAll('.pad button').forEach(b => b.disabled = !connected);
}

async function connect() {
  if (!navigator.bluetooth) {
    log('Web Bluetooth が利用できません。Android Chrome または Bluefy を使ってください。', 'err');
    return;
  }
  try {
    log('デバイスを検索中...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }],
    });
    log(`選択: ${device.name || '(no name)'}`);
    device.addEventListener('gattserverdisconnected', onDisconnected);

    log('GATT 接続中...');
    const server  = await device.gatt.connect();
    await new Promise(r => setTimeout(r, 300));
    const service = await server.getPrimaryService(SERVICE_UUID);

    // Discover all characteristics in parallel to minimize round-trip latency.
    const [cmdCh, statusCh, fbCh, logCh] = await Promise.all([
      service.getCharacteristic(CMD_UUID),
      service.getCharacteristic(STATUS_UUID),
      service.getCharacteristic(FB_UUID),
      service.getCharacteristic(LOG_UUID),
    ]);
    cmdChar = cmdCh;

    // Subscribe to all notify characteristics in parallel.
    await Promise.all([
      statusCh.startNotifications(),
      fbCh.startNotifications(),
      logCh.startNotifications(),
    ]);
    statusCh.addEventListener('characteristicvaluechanged', onStatus);
    fbCh.addEventListener('characteristicvaluechanged', onFrameChunk);
    logCh.addEventListener('characteristicvaluechanged', onDeviceLog);
    statusChar = statusCh; fbChar = fbCh; logChar = logCh;
    log('subscribed', 'ok');

    setConnected(true);
    log('接続完了', 'ok');
  } catch (e) {
    log(`接続エラー: ${e.message}`, 'err');
    setConnected(false);
  }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
}

function onDisconnected() {
  log('切断されました', 'err');
  cmdChar = statusChar = fbChar = logChar = null;
  setConnected(false);
}

function onStatus(ev) {
  const bytes = Array.from(new Uint8Array(ev.target.value.buffer))
    .map(b => b.toString(16).padStart(2, '0')).join(' ');
  log(`RX status: ${bytes}`, 'rx');
}

function onDeviceLog(ev) {
  const text = new TextDecoder().decode(ev.target.value.buffer).replace(/\n$/, '');
  if (!text) return;
  const line = document.createElement('div');
  line.className = 'rx';
  line.textContent = `[device] ${text}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  while (logEl.childNodes.length > 300) logEl.removeChild(logEl.firstChild);
}

function onFrameChunk(ev) {
  const arr = new Uint8Array(ev.target.value.buffer);
  if (arr.length < 1) return;
  const idx = arr[0];
  const data = arr.subarray(1);
  const off = idx * FB_CHUNK;
  if (off + data.length > FB_LEN) return;
  fbBuf.set(data, off);
  if (off + data.length >= FB_LEN) {
    drawFrame();
    frameCount++;
    $('frames').textContent = frameCount;
    const now = performance.now();
    if (now - lastFpsCalcAt >= 1000) {
      $('fps').textContent = ((frameCount - lastFpsFrames) * 1000 / (now - lastFpsCalcAt)).toFixed(1) + ' fps';
      lastFpsCalcAt = now;
      lastFpsFrames = frameCount;
    }
  }
}

function drawFrame() {
  const img = ctx.createImageData(128, 64);
  for (let page = 0; page < 8; page++) {
    for (let col = 0; col < 128; col++) {
      const byte = fbBuf[page * 128 + col];
      for (let bit = 0; bit < 8; bit++) {
        const on = (byte >> bit) & 1;
        const o  = ((page * 8 + bit) * 128 + col) * 4;
        img.data[o]   = on ? 0xff : 0x1a;
        img.data[o+1] = on ? 0xb3 : 0x1d;
        img.data[o+2] = on ? 0x47 : 0x22;
        img.data[o+3] = 0xff;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

async function sendOp(op) {
  if (!cmdChar) return;
  try {
    const data = new Uint8Array([op]);
    if (cmdChar.writeValueWithoutResponse) {
      await cmdChar.writeValueWithoutResponse(data);
    } else {
      await cmdChar.writeValue(data);
    }
    log(`TX ${OP_NAMES[op]} (0x0${op})`, 'tx');
  } catch (e) {
    log(`送信エラー: ${e.message}`, 'err');
  }
}

$('btn-connect').addEventListener('click', connect);
$('btn-disconnect').addEventListener('click', disconnect);
document.querySelectorAll('.pad button').forEach(btn => {
  btn.addEventListener('click', () => sendOp(parseInt(btn.dataset.op, 10)));
});

window.addEventListener('keydown', e => {
  if (!cmdChar) return;
  const map = { ArrowLeft: 1, ArrowRight: 2, ArrowUp: 1, ArrowDown: 2, Enter: 3, Escape: 4 };
  const op = map[e.key];
  if (op !== undefined) { e.preventDefault(); sendOp(op); }
});

setConnected(false);
log('Ready. 「接続」を押すとデバイス選択ダイアログが出ます。');
log('対応: Android Chrome / Edge、PC Chrome / Edge');
</script>
</body>
</html>
